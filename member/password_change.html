<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: #f4f6f9;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 48px 16px;
        }

        .password-box {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .notice {
            background: #f7f9ff;
            border: 1px solid #dfe7ff;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .notice ul {
            padding-left: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        label .required {
            color: #e5484d;
            margin-left: 2px;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 52px 0 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #3b6ef5;
        }

        input.invalid {
            border-color: #e5484d;
        }

        .toggle-btn {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 6px;
        }

        .message {
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
        }

        .message.error {
            color: #e5484d;
        }

        .message.success {
            color: #12a150;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            height: 50px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 50px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-primary {
            border: none;
            background: #3b6ef5;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2f5bd0;
        }

        .btn-outline {
            border: 1px solid #d0d5dd;
            background: #fff;
            color: #555;
        }

        .btn-outline:hover {
            background: #f4f5f7;
        }
    </style>
</head>
<body>
    <div class="password-box">
        <h1>비밀번호 변경</h1>
        <p class="subtitle">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</p>

        <div class="notice">
            <ul>
                <li>영문, 숫자, 특수문자를 포함해 8~20자로 입력해 주세요.</li>
                <li>현재 비밀번호와 다른 비밀번호를 사용해 주세요.</li>
            </ul>
        </div>

        <!-- member.sql 4번 UPDATE : 현재 비밀번호가 일치할 때만 변경 -->
        <form id="passwordForm" action="/member/password" method="post" novalidate>
            <!-- 현재 비밀번호 -->
            <div class="form-group">
                <label for="current_password">현재 비밀번호<span class="required">*</span></label>
                <div class="input-wrap">
                    <input type="password" id="current_password" name="current_password" maxlength="20" autocomplete="current-password">
                    <button type="button" class="toggle-btn" data-target="current_password">보기</button>
                </div>
                <p class="message" id="current_password_msg"></p>
            </div>

            <!-- 새 비밀번호 -->
            <div class="form-group">
                <label for="new_password">새 비밀번호<span class="required">*</span></label>
                <div class="input-wrap">
                    <input type="password" id="new_password" name="new_password" maxlength="20" autocomplete="new-password">
                    <button type="button" class="toggle-btn" data-target="new_password">보기</button>
                </div>
                <p class="message" id="new_password_msg"></p>
            </div>

            <!-- 새 비밀번호 확인 (서버 전송 X) -->
            <div class="form-group">
                <label for="new_password_confirm">새 비밀번호 확인<span class="required">*</span></label>
                <div class="input-wrap">
                    <input type="password" id="new_password_confirm" maxlength="20" autocomplete="new-password">
                    <button type="button" class="toggle-btn" data-target="new_password_confirm">보기</button>
                </div>
                <p class="message" id="new_password_confirm_msg"></p>
            </div>

            <div class="btn-group">
                <a href="mypage.html" class="btn btn-outline">취소</a>
                <button type="submit" class="btn btn-primary">변경하기</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('passwordForm');
        const $ = (id) => document.getElementById(id);

        const passwordRule = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,20}$/;

        function setMessage(id, text, type) {
            const msg = $(id + '_msg');
            msg.textContent = text;
            msg.className = 'message' + (type ? ' ' + type : '');
            $(id).classList.toggle('invalid', type === 'error');
        }

        function validateCurrent() {
            if (!$('current_password').value) return setMessage('current_password', '현재 비밀번호를 입력해 주세요.', 'error'), false;
            setMessage('current_password', '', '');
            return true;
        }

        function validateNew() {
            const value = $('new_password').value;
            if (!value) return setMessage('new_password', '새 비밀번호를 입력해 주세요.', 'error'), false;
            if (!passwordRule.test(value)) return setMessage('new_password', '영문, 숫자, 특수문자를 포함해 8~20자로 입력해 주세요.', 'error'), false;
            if (value === $('current_password').value) return setMessage('new_password', '현재 비밀번호와 다른 비밀번호를 입력해 주세요.', 'error'), false;
            setMessage('new_password', '사용 가능한 비밀번호입니다.', 'success');
            return true;
        }

        function validateConfirm() {
            const value = $('new_password_confirm').value;
            if (!value) return setMessage('new_password_confirm', '새 비밀번호 확인을 입력해 주세요.', 'error'), false;
            if (value !== $('new_password').value) return setMessage('new_password_confirm', '새 비밀번호가 일치하지 않습니다.', 'error'), false;
            setMessage('new_password_confirm', '비밀번호가 일치합니다.', 'success');
            return true;
        }

        // 비밀번호 보기/숨기기
        document.querySelectorAll('.toggle-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = $(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? '숨기기' : '보기';
            });
        });

        $('current_password').addEventListener('blur', validateCurrent);
        $('new_password').addEventListener('blur', validateNew);
        $('new_password').addEventListener('input', () => {
            if ($('new_password_confirm').value) validateConfirm();
        });
        $('new_password_confirm').addEventListener('input', validateConfirm);

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const results = [validateCurrent(), validateNew(), validateConfirm()];
            if (!results.every(Boolean)) {
                const firstError = form.querySelector('.invalid');
                if (firstError) firstError.focus();
                return;
            }

            // TODO: 서버 연동 시 form.submit() 으로 변경
            //       현재 비밀번호 일치 여부는 서버에서 확인 (UPDATE 영향 행 0이면 불일치 → 에러 메시지 표시)
            alert('비밀번호가 변경되었습니다.');
            location.href = 'mypage.html';
        });
    </script>
</body>
</html>
