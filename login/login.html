<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="card">
    <!-- 로그인 폼 -->
    <section id="loginSection">
      <h1>로그인</h1>
      <p class="sub">계정 정보를 입력해 주세요.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="userId">아이디</label>
          <input type="text" id="userId" autocomplete="username" placeholder="아이디">
          <div class="err" id="userIdErr"></div>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호">
            <button type="button" class="toggle-pw" id="togglePw">보기</button>
          </div>
          <div class="err" id="passwordErr"></div>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> 아이디 저장</label>
          <a href="#" id="findPw">비밀번호 찾기</a>
        </div>

        <button type="submit" class="primary" id="submitBtn">로그인</button>
        <div class="msg" id="msg"></div>
      </form>

      <p class="hint">테스트 계정: admin / 1234</p>
    </section>

    <!-- 로그인 후 화면 -->
    <section id="welcome">
      <h1>환영합니다!</h1>
      <p><strong id="welcomeName"></strong>님, 로그인되었습니다.</p>
      <button class="primary" id="logoutBtn">로그아웃</button>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
